<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub contribution streak">
  <style>
    text { font-family: "Segoe UI", Ubuntu, sans-serif; }
    .num { font-size: 28px; font-weight: 700; fill: #38bdae; }
    .label { font-size: 14px; font-weight: 600; fill: #70a5fd; }
    .dates { font-size: 12px; fill: #a9b1d6; }
  </style>
  <rect width="495" height="195" rx="4.5" fill="#1a1b27"/>
  <line x1="165" y1="28" x2="165" y2="170" stroke="#38bdae33" stroke-width="1"/>
  <line x1="330" y1="28" x2="330" y2="170" stroke="#38bdae33" stroke-width="1"/>

  <g text-anchor="middle">
    <text x="82.5" y="79" class="num">602</text>
    <text x="82.5" y="114" class="label">Total Contributions</text>
    <text x="82.5" y="139" class="dates">Nov 19, 2020 - Present</text>
  </g>

  <g text-anchor="middle">
    <circle cx="247.5" cy="71" r="40" fill="none" stroke="#70a5fd" stroke-width="5"/>
    <rect x="234" y="24" width="27" height="20" fill="#1a1b27"/>
    <path transform="translate(237.5 19)" fill="#bf91f3" d="M10 0C10 6 3 8 3 15a7 7 0 0 0 14 0c0-3-1.5-5-3-6.5 0 2.5-1.5 4-3 4 1-3 1-7-1-12.5Z"/>
    <text x="247.5" y="80" class="num">0</text>
    <text x="247.5" y="138" class="label">Current Streak</text>
    <text x="247.5" y="161" class="dates">No current streak</text>
  </g>

  <g text-anchor="middle">
    <text x="412.5" y="79" class="num">6</text>
    <text x="412.5" y="114" class="label">Longest Streak</text>
    <text x="412.5" y="139" class="dates">Sep 13, 2021 - Sep 18, 2021</text>
  </g>
</svg>
